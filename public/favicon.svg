<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00cc52" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00FF66" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Background Hexagon/Rounded Box -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#23232b" stroke-width="8" />

  <!-- Glowing Neon Gift Emblem -->
  <g filter="url(#glow)">
    <!-- Outer accent ring -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="14" stroke-dasharray="16 10" />

    <!-- Center Gift Box Shape -->
    <rect x="156" y="240" width="200" height="150" rx="16" fill="#15151a" stroke="url(#neonGrad)" stroke-width="14" />
    <rect x="136" y="195" width="240" height="48" rx="12" fill="#15151a" stroke="url(#neonGrad)" stroke-width="14" />
    <rect x="236" y="195" width="40" height="195" fill="url(#neonGrad)" />
    <path d="M 236 195 C 190 130 140 160 215 190 Z" fill="url(#neonGrad)" />
    <path d="M 276 195 C 322 130 372 160 297 190 Z" fill="url(#neonGrad)" />
  </g>
</svg>